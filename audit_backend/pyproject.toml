[project]
name = "zhongji-audit-backend"
version = "1.0.0"
description = "CIMC intelligent drawing audit MVP backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "pydantic==2.9.2",
    "sqlalchemy==2.0.35",
    "openai==1.51.0",
    # SPEC 锁定 1.24.9，但本机 Python 3.13 无 cp313 wheel（1.24.9/1.24.10 源码构建失败）；
    # 1.24.11 为首个提供 cp313 wheel 的补丁版本，API 兼容
    "pymupdf==1.24.11",
    "python-docx==1.1.2",
    "ijson==3.3.0",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "ruff==0.6.9",
    "httpx==0.27.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
