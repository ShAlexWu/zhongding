# 前端容器内 nginx 监听 50009（宿主机通过 docker-compose 映射到对外的 8004）。
# 后端服务在同一 docker network 里，容器名 backend，监听 50011。

server {
    listen 50009;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传的图片走这里，默认 1m 太小
    client_max_body_size 50m;

    # gzip 是独立于 proxy_buffering 的另一层输出过滤：即使关了 proxy_buffering，
    # gzip 压缩仍需要攒够数据块才能编码输出，同样会把 /api/upload 的 SSE 流
    # 攒成一次性输出。这里整个 server 范围内关掉，避免和下面的 proxy_buffering
    # off 只生效一半。
    gzip off;

    # 健康检查：约定路径 /health（转发到后端的 /health）
    location = /health {
        proxy_pass http://backend:50011/health;
        proxy_set_header Host $host;
    }

    # 系统 API：/api/...
    location /api/ {
        proxy_pass http://backend:50011/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/upload 用 SSE（text/event-stream）流式推送处理进度，
        # 必须关闭代理缓冲，否则前端会卡住直到整个响应结束才收到数据。
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;

        # 深度解读（Codex）等长任务可能耗时数分钟，超时给宽松一点
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # 片段/图纸缩略图等静态资源
    location /static/ {
        proxy_pass http://backend:50011/static/;
        proxy_set_header Host $host;
    }

    # 前端单页应用路由
    location / {
        try_files $uri $uri/ /index.html;
    }
}
