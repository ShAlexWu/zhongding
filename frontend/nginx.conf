# 前端容器内 nginx 监听 50009（宿主机通过 docker-compose 映射到对外的 8004）。
# 后端服务在同一 docker network 里，容器名 backend，监听 50011。

server {
    listen 50009;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传的图片走这里，默认 1m 太小
    client_max_body_size 200m;

    # gzip 是独立于 proxy_buffering 的另一层输出过滤：即使关了 proxy_buffering，
    # gzip 压缩仍需要攒够数据块才能编码输出，同样会把 /api/upload 的 SSE 流
    # 攒成一次性输出。这里整个 server 范围内关掉，避免和下面的 proxy_buffering
    # off 只生效一半。
    gzip off;

    # 健康检查：约定路径 /health（转发到后端的 /health）
    location = /health {
        proxy_pass http://backend:50011/health;
        proxy_set_header Host $host;
    }

    # 审核健康检查公开；其余审核接口必须通过现有登录会话。
    location = /api/audit/v1/health {
        proxy_pass http://audit-backend:50012/api/v1/health;
        proxy_set_header Host $host;
    }

    location = /_audit_auth {
        internal;
        proxy_pass http://backend:50011/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location /api/audit/ {
        auth_request /_audit_auth;
        proxy_pass http://audit-backend:50012/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 1200s;
        proxy_read_timeout 1200s;
    }

    # 系统 API：/api/...
    location /api/ {
        proxy_pass http://backend:50011/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/upload 用 SSE（text/event-stream）流式推送处理进度，
        # 必须关闭代理缓冲，否则前端会卡住直到整个响应结束才收到数据。
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;

        # 解析+匹配全流程可能耗时数分钟，超时给宽松一点
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # 片段/图纸缩略图等静态资源
    location /static/ {
        proxy_pass http://backend:50011/static/;
        proxy_set_header Host $host;
    }

    # 前端单页应用路由
    location / {
        try_files $uri $uri/ /index.html;
    }
}
